
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-assignment
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/MohamedAbidMiah/redis-assignment.git
    targetRevision: master
    path: helm/redis-assignment

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
