
app:
  name: python-api
  replicas: 2
  image: python-api:latest
  imagePullPolicy: Never
  containerPort: 8000
  servicePort: 80
  nodePort: 30080

redis:
  name: redis
  replicas: 1
  image: redis:7
  containerPort: 6379
  servicePort: 6379

config:
  redisHost: redis
  redisPort: "6379"

secret:
  redisPassword: redis-123

ingress:
  enabled: true
  className: nginx
  host: localhost
  path: /api(.*)
  rewriteTarget: "$1"
